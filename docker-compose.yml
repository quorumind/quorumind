services:
  quorumind:
    build: .
    # Reachable from this machine only: the server has no accounts (SECURITY.md)
    ports:
      - "127.0.0.1:8787:8787"
    env_file: .env
    # Inside the container, whatever .env says: listen on every interface of the container (the port above stays
    # on 127.0.0.1) and keep the data on the volume
    environment:
      HOST: 0.0.0.0
      QUORUMIND_DATA_DIR: /data
    volumes:
      - quorumind-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    # Logs rotated: 3 files of 10 MB at most
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  quorumind-data:
