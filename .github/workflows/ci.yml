name: CI

# Lint, types, tests, the recorded benchmark and the build, at every push to main and on pull requests.
# Actions are pinned to a full commit SHA (their version in a comment); Dependabot proposes the updates.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read the code, nothing else: a pull request's run cannot write to the repository
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A run takes a few minutes; one that hangs fails here instead of after 6 hours
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The version of the Dockerfile
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run bench
      - run: npm run build
