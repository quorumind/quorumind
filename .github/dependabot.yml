# Dependencies are pinned to exact versions; updates are proposed once a release is two weeks old. Security updates
# (Settings › Code security › Dependabot security updates) are not held back by the cooldown: a fix for a published
# advisory is proposed at once. .github/workflows/audit.yml checks every day what is still open.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
  # The Node base image of the Dockerfile, on its major version (a new one is moved to by hand, with CI)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
